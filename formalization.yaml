sources:
  - title: "The existence of designs II"
    authors:
      - "Peter Keevash"
    id: "arXiv:1802.05900"
    type: "paper"
    location: "arXiv:1802.05900v1: Section 2 (Definitions 2.1–2.9, 2.11–2.12, 2.17–2.23, Lemma 2.21), Section 3.2 (Definition 3.2, the template), Section 3.3 (local events, Lemma 3.6 e|E, Lemma 3.8 ext*)"
    relationship: "formalizes"
    note: >-
      The template is modelled by independent uniform permutations: f_j is a permutation of [N]
      read through a bijection κ : [N] ≃ K with a finite field K ⊇ F (N = |K| ≥ n), T_e, π_e
      and A_φ are permutations read at a fixed position, and the activation of φ is a uniform
      permutation of [N_act] with threshold k_φ (a rational version of the paper's probability
      y_φ ω n^(q−r)). The proof of the paper's sketch ("the proof of concentration is similar to
      that in [Kexist, Lemma 3.8]") needed several repairs, made here: (1) changing f_j at a
      fixed vertex moves a Θ(1/z) fraction of the configurations, so the concentration is
      proved conditionally on the values of the colours at the fixed vertices (with an
      exceptional set: colours whose fixed values are F-linearly dependent occur with
      probability O(1/n) each, and at least kd of them with probability C(z,kd) p_deg^kd);
      (2) the concentration is split into two stages, colours first and T, π, A, activations
      second, with second-stage Lipschitz constants depending on the colours (only copies
      compatible with the colours matter); a single-stage bounded-differences bound is too
      weak; (3) the conditional passing probability (Lemma e|E) is computed exactly as a count
      of points on an affine slice minus collisions. The formalization is by a different
      author; the article's author was not involved.
