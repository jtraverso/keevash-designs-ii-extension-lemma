fidelity:
  divergences: >-
    (a) Probability space: independent uniform permutations instead of the paper's independent
    uniform injections and Bernoulli activations; the activation probability is k_φ/N_act. (b)
    The template uses one family member A (A_φ = A is one of the tests, probability 1/|𝒜|); the
    paper's M* contains the copies of every A ∈ 𝒜, so ∂^γ M* here is below the paper's and the
    lower bound transfers. (c) The paper's statement "whp X > ω n^(v_E) (zρ/2)^|H'|" is given
    with explicit rates: X ≥ |C|(z+1−kd)_m(a^m − m²K_c n^((q−r)(m−2)))p^m − 2εN^v; the
    configurations C, their labelled edges ψ b i and the counting bounds (|C| ≤ ΔN^v, at most
    ΔN^(v−(r−|F_i|)) configurations through an edge) are hypotheses, satisfied by the paper's
    X_{E,H'} (ConfigCount.lean gives the counting bounds for configurations given by maps on
    the new vertices). (d) M is a generic q×r matrix over a finite field F (every r×r
    submatrix nonsingular) with distinct rows, K ⊇ F a finite field with |K| = N; the paper
    uses F_p ⊆ F_{p^a}. (e) Extendability (Definition 2.9) is formalized as IsExtendableRel
    with partite complexes H ⊆ R(Fin s) and labellings t of the maps outside H[F].

